<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍길동의 자기소개</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    word-break: keep-all;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: linear-gradient(180deg, #fff3e6 0%, #ffffff 60%);
    color: #213547;
  }
  header { text-align: center; padding: 48px 20px 16px; }
  .wave { font-size: 64px; }
  header h1 { font-size: 46px; margin: 8px 0 0; color: #e8710a; }
  header p { font-size: 22px; margin: 10px 0 0; color: #5a4632; }
  .why {
    max-width: 760px; margin: 24px auto 8px; padding: 24px 28px;
    background: #ffffff; border-radius: 20px; border-left: 10px solid #f28c28;
    box-shadow: 0 8px 24px rgba(33, 53, 71, 0.10);
  }
  .why h2 { font-size: 22px; margin: 0 0 8px; color: #e8710a; }
  .why p { font-size: 21px; line-height: 1.6; margin: 0; }
  .title { text-align: center; font-size: 26px; margin: 36px 0 4px; color: #5a4632; }
  .cards {
    display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
    padding: 20px; max-width: 1100px; margin: 0 auto;
  }
  .card {
    width: 300px; background: #ffffff; border-radius: 20px; padding: 26px 24px;
    box-shadow: 0 8px 24px rgba(33, 53, 71, 0.12);
    border-top: 8px solid #f28c28; transition: transform 0.2s;
  }
  .card:nth-child(2) { border-top-color: #ffb74d; }
  .card:nth-child(3) { border-top-color: #e8710a; }
  .card:hover { transform: scale(1.05); }
  .emoji { font-size: 52px; }
  .card h3 { font-size: 25px; margin: 10px 0 8px; }
  .card p { font-size: 18px; line-height: 1.6; margin: 0; }
  footer { text-align: center; padding: 40px 20px; font-size: 20px; color: #5a4632; }
</style>
</head>
<body>
  <header>
    <div class="wave">👋</div>
    <h1>홍길동</h1>
    <p>제주 바다를 좋아하는 직장인</p>
  </header>
  <section class="why">
    <h2>이 수업을 신청한 이유</h2>
    <p>AI로 일을 더 편하게 하는 방법이 궁금해서 신청했습니다.</p>
  </section>
  <h2 class="title">나의 관심사</h2>
  <section class="cards">
    <div class="card">
      <div class="emoji">⛰️</div>
      <h3>오름 산책</h3>
      <p>주말마다 가까운 오름을 천천히 걷습니다.</p>
    </div>
    <div class="card">
      <div class="emoji">📷</div>
      <h3>사진 찍기</h3>
      <p>제주의 하늘과 바다를 휴대폰으로 담습니다.</p>
    </div>
    <div class="card">
      <div class="emoji">💡</div>
      <h3>새로운 기술</h3>
      <p>요즘은 AI와 아두이노가 가장 궁금합니다.</p>
    </div>
  </section>
  <footer>만나서 반갑습니다 🙏</footer>
</body>
</html>
