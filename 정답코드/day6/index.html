<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍길동의 자기소개 · 응원 방명록</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    word-break: keep-all;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: linear-gradient(180deg, #fff3e6 0%, #ffffff 60%);
    color: #213547;
  }
  header { text-align: center; padding: 48px 20px 16px; }
  .wave { font-size: 64px; }
  header h1 { font-size: 46px; margin: 8px 0 0; color: #e8710a; }
  header p { font-size: 22px; margin: 10px 0 0; color: #5a4632; }
  .why {
    max-width: 760px; margin: 24px auto 8px; padding: 24px 28px;
    background: #ffffff; border-radius: 20px; border-left: 10px solid #f28c28;
    box-shadow: 0 8px 24px rgba(33, 53, 71, 0.10);
  }
  .why h2 { font-size: 22px; margin: 0 0 8px; color: #e8710a; }
  .why p { font-size: 21px; line-height: 1.6; margin: 0; }
  .title { text-align: center; font-size: 26px; margin: 36px 0 4px; color: #5a4632; }
  .cards {
    display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
    padding: 20px; max-width: 1100px; margin: 0 auto;
  }
  .card {
    width: 300px; background: #ffffff; border-radius: 20px; padding: 26px 24px;
    box-shadow: 0 8px 24px rgba(33, 53, 71, 0.12);
    border-top: 8px solid #f28c28; transition: transform 0.2s;
  }
  .card:nth-child(2) { border-top-color: #ffb74d; }
  .card:nth-child(3) { border-top-color: #e8710a; }
  .card:hover { transform: scale(1.05); }
  .emoji { font-size: 52px; }
  .card h3 { font-size: 25px; margin: 10px 0 8px; }
  .card p { font-size: 18px; line-height: 1.6; margin: 0; }
  .go { display: flex; justify-content: center; padding: 8px 20px 0; }
  .go a {
    display: inline-block; padding: 16px 28px; border-radius: 999px; background: #e8710a; color: #ffffff;
    font-size: 21px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 18px rgba(232, 113, 10, 0.3);
  }
  .go a:hover { background: #c95f05; }
  .guest {
    max-width: 760px; margin: 36px auto 0; padding: 24px 28px; background: #ffffff;
    border-radius: 20px; box-shadow: 0 8px 24px rgba(33, 53, 71, 0.10);
  }
  .guest h2 { font-size: 24px; margin: 0 0 4px; color: #e8710a; }
  .guest-note { font-size: 16px; color: #5a4632; margin: 0 0 14px; }
  .guest form { display: grid; gap: 10px; }
  .guest input, .guest textarea {
    font: inherit; font-size: 18px; padding: 12px 14px; border: 2px solid #f3d3b4; border-radius: 12px; width: 100%;
  }
  .guest input:focus, .guest textarea:focus { outline: none; border-color: #e8710a; }
  .guest button {
    justify-self: end; font: inherit; font-size: 18px; font-weight: 700; padding: 10px 26px; border: 0;
    border-radius: 999px; background: #e8710a; color: #ffffff; cursor: pointer;
  }
  .guest button:disabled { background: #c9b8a6; cursor: not-allowed; }
  .guest ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
  .guest li { background: #fff7ef; border-radius: 14px; padding: 12px 16px; }
  .guest li b { font-size: 17px; }
  .guest li time { font-size: 14px; color: #8a7560; margin-left: 8px; }
  .guest li p { margin: 4px 0 0; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
  footer { text-align: center; padding: 40px 20px; font-size: 20px; color: #5a4632; }
</style>
</head>
<body>
  <header>
    <div class="wave">👋</div>
    <h1>홍길동</h1>
    <p>제주 바다를 좋아하는 직장인</p>
  </header>
  <section class="why">
    <h2>이 수업을 신청한 이유</h2>
    <p>AI로 일을 더 편하게 하는 방법이 궁금해서 신청했습니다.</p>
  </section>
  <h2 class="title">나의 관심사</h2>
  <section class="cards">
    <div class="card">
      <div class="emoji">⛰️</div>
      <h3>오름 산책</h3>
      <p>주말마다 가까운 오름을 천천히 걷습니다.</p>
    </div>
    <div class="card">
      <div class="emoji">📷</div>
      <h3>사진 찍기</h3>
      <p>제주의 하늘과 바다를 휴대폰으로 담습니다.</p>
    </div>
    <div class="card">
      <div class="emoji">💡</div>
      <h3>새로운 기술</h3>
      <p>요즘은 AI와 아두이노가 가장 궁금합니다.</p>
    </div>
  </section>
  <nav class="go"><a href="hand.html">🖐 손 인식 체험하기</a></nav>
  <section class="guest" id="guestbook">
    <h2>💬 응원 한마디</h2>
    <p class="guest-note" id="gbStatus">방명록 불러오는 중…</p>
    <form id="gbForm" autocomplete="off">
      <input id="gbName" maxlength="20" placeholder="이름 또는 별명 (20자까지)" aria-label="이름 또는 별명">
      <textarea id="gbMsg" maxlength="100" rows="2" placeholder="응원 한마디 (100자까지)" aria-label="응원 한마디"></textarea>
      <button id="gbBtn" type="submit">남기기</button>
    </form>
    <ul id="gbList"></ul>
  </section>
  <footer>만나서 반갑습니다 🙏</footer>
<script type="module">
  // 응원 방명록: Firebase Cloud Firestore에 글을 저장하고, 새 글을 실시간으로 보여 주는 코드
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limit, onSnapshot }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  // ▼ 아래 한 줄을 지우고 그 자리에 내 Firebase 설정값(const firebaseConfig = { … };)을 붙여넣기
  const firebaseConfig = { apiKey: "여기에_설정값_붙여넣기", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
  const COLLECTION = "guestbook";                          // 방명록 글을 모아 두는 묶음(컬렉션) 이름

  const statusEl = document.getElementById("gbStatus");   // 안내 문구
  const form = document.getElementById("gbForm");         // 입력 칸 묶음
  const nameIn = document.getElementById("gbName");       // 이름 칸
  const msgIn = document.getElementById("gbMsg");         // 한마디 칸
  const btn = document.getElementById("gbBtn");           // 남기기 버튼
  const list = document.getElementById("gbList");         // 글 목록

  function lock(text) {                                    // 방명록을 쓸 수 없을 때 칸을 잠그는 함수
    statusEl.textContent = text;
    nameIn.disabled = true; msgIn.disabled = true; btn.disabled = true;
  }

  function when(ts) {                                      // 저장 시각을 '10월 27일 오후 8:10'처럼 바꾸는 함수
    if (!ts || !ts.toDate) return "방금";
    return ts.toDate().toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("여기에")) {
    lock("⚠️ 아직 설정값이 없음. 내 Firebase 설정값(firebaseConfig)으로 바꾼 뒤 다시 올리기");
  } else {
    const app = initializeApp(firebaseConfig);             // Firebase 연결
    const db = getFirestore(app);                          // 데이터베이스(Firestore) 연결
    const ref = collection(db, COLLECTION);                // 내 방명록 묶음(컬렉션)

    // 최신 글 50개를 실시간으로 받아 와 목록 다시 그리기
    onSnapshot(query(ref, orderBy("createdAt", "desc"), limit(50)), (snap) => {
      list.textContent = "";
      snap.forEach((doc) => {
        const d = doc.data({ serverTimestamps: "estimate" });
        const li = document.createElement("li");
        const who = document.createElement("b");
        who.textContent = d.name || "익명";                // 글은 textContent로만 넣기(보안)
        const t = document.createElement("time");
        t.textContent = when(d.createdAt);
        const p = document.createElement("p");
        p.textContent = d.message || "";
        li.append(who, t, p);
        list.appendChild(li);
      });
      statusEl.textContent = snap.size ? "응원 " + snap.size + "개 · 새 글은 바로 나타남" : "첫 응원 한마디를 기다리는 중";
    }, (err) => {
      lock(err.code === "permission-denied"
        ? "❌ 방명록 권한 없음. Firestore 테스트 모드(약 30일)나 보안 규칙 확인 필요"
        : "❌ 방명록 불러오기 실패: " + err.message);
    });

    // '남기기' 버튼을 누르면 글 저장
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameIn.value.trim().slice(0, 20);
      const message = msgIn.value.trim().slice(0, 100);
      if (!name || !message) { statusEl.textContent = "✍️ 이름과 한마디를 모두 입력"; return; }
      btn.disabled = true;
      try {
        await addDoc(ref, { name, message, createdAt: serverTimestamp() });
        msgIn.value = "";
      } catch (err) {
        statusEl.textContent = "❌ 저장 실패: " + (err.code === "permission-denied" ? "Firestore 보안 규칙 확인 필요" : err.message);
      } finally {
        btn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
