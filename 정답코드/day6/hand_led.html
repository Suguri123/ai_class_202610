<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손으로 LED 켜기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    background: #0f1d2e;
    color: #ffffff;
  }
  header { padding: 14px 24px; background: #f28c28; color: #1b1b1b; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; font-size: 16px; }
  #status {
    margin: 16px 20px 0; padding: 12px 18px; border-radius: 12px;
    background: #1c2f47; border-left: 6px solid #ffb547; font-size: 19px; line-height: 1.5;
  }
  main { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-start; }

  /* 카메라 화면 */
  .camera {
    position: relative; flex: 1 1 520px; max-width: 820px;
    background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3;
  }
  .camera canvas { width: 100%; height: 100%; display: block; }
  .camera video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #cover {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #cfd8e3; text-align: center; padding: 20px;
  }

  /* 오른쪽 정보판 */
  .panel { flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #1c2f47; border-radius: 16px; padding: 16px 18px; }
  .label { font-size: 18px; color: #9fb3c8; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #count { font-size: 96px; font-weight: 800; line-height: 1; text-align: center; color: #ffb547; }
  #gesture { font-size: 32px; font-weight: 700; text-align: center; min-height: 44px; }
  button {
    font-family: inherit; font-size: 20px; font-weight: 700; padding: 12px 16px;
    border: none; border-radius: 12px; cursor: pointer; background: #ffb547; color: #1b1b1b;
  }
  button.blue { background: #4fc3f7; }
  button.gray { background: #8a9bb0; }
  button:disabled, button.blue:disabled, button.gray:disabled { background: #4a5a6e; color: #c9d3de; cursor: not-allowed; }
  .num { flex: 1 1 40px; font-size: 26px; padding: 10px 0; background: #2f4a6b; color: #fff; }
  #serialState { font-size: 20px; font-weight: 700; }
  .on { color: #7CFC9A; }
  .off { color: #ff9b9b; }
  #sent { font-size: 20px; margin-top: 8px; }
  #log {
    font-family: Consolas, "D2Coding", monospace; font-size: 15px; background: #0b1522;
    border-radius: 10px; padding: 10px; height: 110px; overflow-y: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
<header>
  <h1>🖐 손으로 LED 켜기</h1>
  <p>AI가 센 손가락 개수(0~5)를 아두이노로 전송합니다. 아두이노에는 '수신기(led_receiver)' 코드 업로드 필요.</p>
</header>
<div id="status">AI 모델 불러오는 중… (처음 한 번은 10초~1분 소요)</div>

<main>
  <div class="camera">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="cover">① 🔌 아두이노 연결 → ② 📷 카메라 켜기 순서로 클릭</div>
  </div>

  <div class="panel">
    <!-- 아두이노 연결 -->
    <div class="card">
      <div class="label">아두이노</div>
      <div class="row">
        <button id="connectBtn" class="blue">🔌 아두이노 연결</button>
        <button id="disconnectBtn" class="gray" disabled>연결 끊기</button>
      </div>
      <div style="margin-top:10px">상태: <span id="serialState" class="off">연결 안 됨</span></div>
      <div id="sent">보낸 숫자: -</div>
    </div>

    <!-- 손 인식 -->
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items: center;">
        <div class="label" style="margin:0">펴진 손가락</div>
        <button id="startBtn" disabled>⏳ AI 준비 중...</button>
      </div>
      <div id="count">-</div>
      <div id="gesture">-</div>
    </div>

    <!-- 손 없이 테스트 -->
    <div class="card">
      <div class="label">손 없이 테스트 (누르면 바로 전송)</div>
      <div class="row" id="numButtons"></div>
    </div>

    <!-- 아두이노가 보낸 말 -->
    <div class="card">
      <div class="label">아두이노가 보낸 말</div>
      <div id="log"></div>
    </div>

  </div>
</main>

<!-- 라이브러리를 못 불러올 때(인터넷 문제) 안내 -->
<script>
  setTimeout(function () {
    if (!window.handAppStarted) {
      document.getElementById("status").textContent =
        "❌ AI 라이브러리 불러오기 실패. 인터넷 연결 확인 후 새로고침(F5)";
    }
  }, 20000);
</script>

<script type="module">
  import { FilesetResolver, GestureRecognizer, DrawingUtils }
    from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";
  window.handAppStarted = true;

  // ── 주소 설정 ─────────────────────────────────────────
  const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
  const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";
  const BAUD_RATE = 9600;    // 아두이노 코드의 Serial.begin(9600)과 같은 값

  // ── 화면 요소 ─────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const drawer = new DrawingUtils(ctx);
  const startBtn = $("startBtn");
  const connectBtn = $("connectBtn");
  const disconnectBtn = $("disconnectBtn");
  const statusEl = $("status");

  const GESTURE_NAMES = {
    Closed_Fist: "✊ 주먹",
    Open_Palm: "🖐 보",
    Pointing_Up: "☝ 하나",
    Victory: "✌ 브이",
    Thumb_Up: "👍 최고",
    Thumb_Down: "👎 별로",
    ILoveYou: "🤟 사랑해",
  };

  let recognizer = null;
  let lastVideoTime = -1;
  let candidate = null;      // 지금 보이는 손가락 개수 (아직 확정 전)
  let candidateSince = 0;    // 그 개수가 처음 보인 시각
  let shownCount = null;     // 확정된 개수
  let lastSent = null;       // 마지막으로 보낸 숫자

  // ═════════════════════════════════════════════════════
  //  A. 아두이노 연결 (Web Serial)
  // ═════════════════════════════════════════════════════
  let port = null;
  let writer = null;
  let reader = null;
  let readingDone = null;
  let readyAt = 0;           // 아두이노가 다시 시작을 마치는 시각

  function setSerialState(text, connected) {
    $("serialState").textContent = text;
    $("serialState").className = connected ? "on" : "off";
    connectBtn.disabled = connected;
    disconnectBtn.disabled = !connected;
  }

  function addLog(text) {
    const log = $("log");
    log.textContent += text + "\n";
    const lines = log.textContent.split("\n");
    if (lines.length > 40) log.textContent = lines.slice(-40).join("\n");
    log.scrollTop = log.scrollHeight;
  }

  async function connectArduino() {
    if (!("serial" in navigator)) {
      statusEl.textContent = "❌ 이 브라우저는 아두이노 연결 불가. 크롬 또는 엣지로 파일 열기";
      return;
    }
    try {
      port = await navigator.serial.requestPort();   // 포트 고르는 창 띄우기
      await port.open({ baudRate: BAUD_RATE });
    } catch (e) {
      console.error(e);
      port = null;
      if (e.name === "NotFoundError") {
        statusEl.textContent = "ℹ️ 포트 선택 취소됨. 다시 클릭 후 'COM'이 붙은 항목 선택";
      } else {
        statusEl.textContent = "❌ 포트 열기 실패. 아두이노 IDE의 시리얼 모니터나 다른 탭이 사용 중인지 확인 후 종료";
      }
      return;
    }
    writer = port.writable.getWriter();
    readingDone = readLoop();
    readyAt = performance.now() + 2000;   // 연결 시 아두이노가 재시작하므로 2초 대기
    setSerialState("연결됨 ✅", true);
    statusEl.textContent = "🔌 아두이노 연결 완료. 2초 후부터 숫자 전송 가능";
    setTimeout(() => {
      if (shownCount !== null && shownCount >= 0) sendNumber(shownCount);
    }, 2100);
  }

  // 아두이노가 보내는 글을 계속 읽어서 화면에 보여 주기
  async function readLoop() {
    const decoder = new TextDecoder();
    let buffer = "";
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (line) addLog("🤖 " + line);
        }
      }
    } catch (e) {
      console.error(e);   // 케이블이 빠지면 여기로 이동
    } finally {
      reader.releaseLock();
      reader = null;
    }
  }

  async function disconnectArduino(message) {
    const p = port;
    port = null;
    try { if (reader) await reader.cancel(); } catch (e) { console.error(e); }
    try { if (readingDone) await readingDone; } catch (e) { console.error(e); }
    try { if (writer) writer.releaseLock(); } catch (e) { console.error(e); }
    writer = null;
    try { if (p) await p.close(); } catch (e) { console.error(e); }
    lastSent = null;
    setSerialState("연결 안 됨", false);
    statusEl.textContent = message || "🔌 연결 끊김. (코드 업로드 전에는 반드시 연결 끊기)";
  }

  // 숫자 하나(0~5)를 글자로 보내기
  async function sendNumber(n) {
    if (!writer) {
      $("sent").textContent = "보낸 숫자: - (아두이노 연결 전)";
      return;
    }
    if (performance.now() < readyAt) {         // 아직 아두이노가 다시 시작하는 중
      $("sent").textContent = "보낸 숫자: - (아두이노 준비 중… 잠시 후 다시 클릭)";
      return;
    }
    try {
      await writer.write(new TextEncoder().encode(String(n)));
      lastSent = n;
      $("sent").textContent = "보낸 숫자: " + n;
    } catch (e) {
      console.error(e);
      await disconnectArduino("⚠️ 아두이노 연결 끊김. 케이블 확인 후 다시 연결");
    }
  }

  connectBtn.addEventListener("click", connectArduino);
  disconnectBtn.addEventListener("click", () => disconnectArduino());
  if ("serial" in navigator) {
    navigator.serial.addEventListener("disconnect", (event) => {
      if (port && event.target === port) {
        disconnectArduino("⚠️ USB 케이블 분리됨. 다시 꽂고 '아두이노 연결' 클릭");
      }
    });
  }

  // 손 없이 테스트하는 숫자 버튼 0~5 만들기
  for (let n = 0; n <= 5; n++) {
    const b = document.createElement("button");
    b.className = "num";
    b.textContent = String(n);
    b.addEventListener("click", () => sendNumber(n));
    $("numButtons").appendChild(b);
  }

  // ═════════════════════════════════════════════════════
  //  B. 손 인식 (MediaPipe)
  // ═════════════════════════════════════════════════════
  async function loadModel() {
    const vision = await FilesetResolver.forVisionTasks(WASM_URL);
    const options = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL_URL, delegate: delegate },
      runningMode: "VIDEO",
      numHands: 1,
    });
    try {
      recognizer = await GestureRecognizer.createFromOptions(vision, options("GPU"));
    } catch (e) {
      // 그래픽 가속(GPU)이 안 되는 노트북이면 CPU로 다시 시도
      recognizer = await GestureRecognizer.createFromOptions(vision, options("CPU"));
    }
  }

  loadModel().then(() => {
    startBtn.disabled = false;
    startBtn.textContent = "📷 카메라 켜기";
    statusEl.textContent = "✅ AI 준비 완료. 아두이노 연결 후 카메라 켜기";
  }).catch((e) => {
    console.error(e);
    statusEl.textContent = "❌ AI 모델 불러오기 실패. 인터넷 연결 확인 후 새로고침(F5) (숫자 버튼 테스트는 가능)";
  });

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 }, audio: false,
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      $("cover").style.display = "none";
      startBtn.textContent = "🎥 켜짐";
      statusEl.textContent = "🖐 카메라에 손바닥 비추기";
      requestAnimationFrame(loop);
    } catch (e) {
      console.error(e);
      startBtn.disabled = false;
      if (e.name === "NotAllowedError") {
        statusEl.textContent = "❌ 카메라 권한 차단 상태. 주소창 왼쪽 아이콘 → 카메라 '허용' → 새로고침(F5)";
      } else if (e.name === "NotReadableError") {
        statusEl.textContent = "❌ 다른 프로그램(줌, 카메라 앱 등)이 카메라 사용 중. 해당 프로그램 종료 후 다시 클릭";
      } else {
        statusEl.textContent = "❌ 카메라 켜기 실패: " + e.message;
      }
    }
  });

  // 두 점 사이의 거리
  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
  }

  // 점 21개(p)를 보고 펴진 손가락 개수(0~5)를 셉니다.
  function countFingers(p) {
    let count = 0;
    // 엄지: 손끝(4)이 새끼손가락 뿌리(17)에서 엄지 둘째 마디(3)보다 멀면 '펴짐'
    if (dist(p[4], p[17]) > dist(p[3], p[17])) count++;
    // 검지·중지·약지·새끼: 손끝이 손목(0)에서 둘째 마디보다 멀면 '펴짐'
    const tips = [8, 12, 16, 20];
    const pips = [6, 10, 14, 18];
    for (let i = 0; i < 4; i++) {
      if (dist(p[tips[i]], p[0]) > dist(p[pips[i]], p[0])) count++;
    }
    return count;
  }

  function loop() {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try {
        const result = recognizer.recognizeForVideo(video, performance.now());
        drawFrame(result);
        updateInfo(result);
      } catch (e) {
        console.error(e);
        statusEl.textContent = "⚠️ 손 인식 중 오류 발생. 새로고침(F5) 필요";
      }
    }
    requestAnimationFrame(loop);
  }

  // 카메라 영상 + 손 점 그리기 (거울처럼 좌우 반전)
  function drawFrame(result) {
    const w = canvas.width, h = canvas.height;
    ctx.save();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, w, h);
    ctx.restore();
    for (const hand of result.landmarks) {
      const mirrored = hand.map((pt) => ({ ...pt, x: 1 - pt.x }));
      drawer.drawConnectors(mirrored, GestureRecognizer.HAND_CONNECTIONS, { color: "#ffffff", lineWidth: 4 });
      drawer.drawLandmarks(mirrored, { color: "#ff7a00", fillColor: "#ffb547", lineWidth: 2, radius: 6 });
    }
  }

  function updateInfo(result) {
    let fingers = -1;   // -1 = 손이 안 보임
    if (result.landmarks.length === 0) {
      $("gesture").textContent = "손이 보이지 않음";
    } else {
      const points = (result.worldLandmarks && result.worldLandmarks[0]) || result.landmarks[0];
      fingers = countFingers(points);
      const top = result.gestures[0] && result.gestures[0][0];
      const sure = top && top.score >= 0.6 ? top.categoryName : "";
      $("gesture").textContent = GESTURE_NAMES[sure] || "🤔 (모르는 모양)";
      // 주먹·엄지척은 AI의 손 모양 판단이 더 정확하므로 그 결과 사용
      if (sure === "Closed_Fist") fingers = 0;
      if (sure === "Thumb_Up" || sure === "Thumb_Down") fingers = 1;
    }
    stabilize(fingers);
  }

  // 같은 개수가 0.3초 이상 유지되면 '확정', 바뀌었을 때만 아두이노로 전송
  function stabilize(fingers) {
    const now = performance.now();
    if (fingers !== candidate) {
      candidate = fingers;
      candidateSince = now;
      return;
    }
    if (now - candidateSince < 300 || fingers === shownCount) return;
    shownCount = fingers;
    if (fingers < 0) {
      $("count").textContent = "-";      // 손이 없으면 전송하지 않고 대기
      statusEl.textContent = "🖐 카메라에 손바닥 비추기";
      return;
    }
    $("count").textContent = String(fingers);
    statusEl.textContent = writer
      ? "👀 손가락 " + fingers + "개 → 아두이노로 전송"
      : "👀 손가락 " + fingers + "개 인식 (아두이노 연결 시 LED 점등)";
    if (fingers !== lastSent) sendNumber(fingers);
  }
</script>
</body>
</html>
